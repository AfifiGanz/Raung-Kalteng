name: Uji Raun Kalteng

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raun-kalteng
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi uji
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Uji mesin dan data
        run: npm test
      - name: Pastikan dist/ sudah dibangun ulang
        run: npm run build && git diff --exit-code -- dist/ || (echo "dist/raun-kalteng-offline.html belum diperbarui. Jalankan: node build.mjs" && exit 1)
      - name: Uji di browser (Playwright + axe)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          AXE=node_modules/axe-core/axe.min.js npm run test:e2e
